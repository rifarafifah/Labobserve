function notify(message,kind=''){const el=$('#notice');el.textContent=message;el.className='notice';if(kind==='error')el.style.background='#8d333d';else if(kind==='good')el.style.background='#176343';else el.style.background='#1d3e70';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hide'),4500)}
function showModal(title,content){$('#modalContent').innerHTML=`<div class="modal-head"><h2>${h(title)}</h2><button class="btn outline tiny" data-act="close-modal" type="button">Tutup</button></div><div class="modal-body">${content}</div>`;$('#modal').showModal()}
function closeModal(){if($('#modal').open)$('#modal').close()}
function setTopInfo(t){$('#topInfo').textContent=t}
function showError(err,context=''){notify(`${context}${errText(err)}`,'error');console.error(context,err)}
function userFriendly(err){let t=errText(err);if(/anonymous|disabled/i.test(t))t+=' — aktifkan Anonymous Sign-ins di Supabase Authentication.';if(/permission denied|42501/i.test(t))t+=' — periksa izin/RLS Supabase.';return t}
async function authenticate(){if(!db)throw new Error('Library Supabase gagal dimuat. Periksa koneksi internet.');const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session?.user){me=data.session.user;return}const r=await db.auth.signInAnonymously();if(r.error)throw r.error;me=r.data.user}
async function listGroups(){if(!me)return;const {data,error}=await db.from('group_members').select('group_id,member_role,display_name').eq('user_id',me.id);if(error)throw error;const ids=(data||[]).map(x=>x.group_id);groupsMine=[];if(ids.length){const r=await db.from('observation_groups').select('id,group_name,school_name,group_code').in('id',ids);if(r.error)throw r.error;groupsMine=(r.data||[]).map(g=>({...g,member_role:data.find(m=>m.group_id===g.id)?.member_role,display_name:data.find(m=>m.group_id===g.id)?.display_name}))}}
function renderEntry(message=''){group=null;setTopInfo('Academic Blue · Supabase');app.innerHTML=`<div class="entry"><div class="entry-hero"><div style="font-size:27px">⚗</div><div class="eyebrow" style="color:#cfe1ff">LEMBAR OBSERVASI KOLABORATIF</div><h1>LabObserve</h1><p>Checklist pengamatan dan status dokumentasi foto per laboratorium, dengan wawancara pada bagian tersendiri.</p></div>${message?`<div class="banner fail" style="margin-top:14px">${h(message)}</div>`:''}<div class="entry-grid" style="margin-top:17px"><section class="paper"><h2>Buat Kelompok</h2><p class="muted small">Untuk ketua kelompok. Kode ketua hanya muncul saat pembuatan.</p><form id="createGroupForm" class="stack"><div class="field"><label>Nama kelompok</label><input class="input" name="groupName" minlength="2" maxlength="100" placeholder="Kelompok Observasi 1" required></div><div class="field"><label>Nama sekolah</label><input class="input" name="schoolName" minlength="2" maxlength="180" placeholder="SMA Negeri ..." required></div><div class="field"><label>Nama ketua</label><input class="input" name="displayName" minlength="2" maxlength="70" placeholder="Nama kamu" required></div><button class="btn wide" type="submit">Buat Kelompok Online</button></form></section><section class="paper"><h2>Gabung Kelompok</h2><p class="muted small">Anggota cukup mengisi nama dan kode. Kode ketua hanya untuk pemulihan peran.</p><form id="joinGroupForm" class="stack"><div class="field"><label>Nama anggota</label><input class="input" name="displayName" minlength="2" maxlength="70" placeholder="Nama kamu" required></div><div class="field"><label>Kode kelompok</label><input class="input" name="groupCode" placeholder="LAB-..." required></div><div class="field"><label>Kode ketua (opsional)</label><input class="input" name="leaderCode" placeholder="Kosongkan untuk anggota biasa"></div><button class="btn wide" type="submit">Gabung Kelompok Online</button></form></section></div>${groupsMine.length?`<section class="paper"><h2>Kelompok yang pernah dibuka di perangkat ini</h2>${groupsMine.map(g=>`<div class="group-link"><div><b>${h(g.group_name)}</b><p>${h(g.school_name)} · ${h(g.member_role==='leader'?'Ketua':'Anggota')} · ${h(g.group_code)}</p></div><button class="btn outline tiny" data-act="open-group" data-id="${h(g.id)}">Buka</button></div>`).join('')}</section>`:''}<div class="banner warn">Data checklist, status dokumentasi, dan wawancara disimpan ke Supabase. Tidak ada fitur upload media; siapkan foto secara terpisah. Mode offline harus diuji sebelum digunakan di sekolah.</div></div>`}
async function createGroup(form){const f=new FormData(form);const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const {data,error}=await db.rpc('create_observation_group',{p_group_name:String(f.get('groupName')).trim(),p_school_name:String(f.get('schoolName')).trim(),p_display_name:String(f.get('displayName')).trim()});if(error)throw error;const row=data?.[0];if(!row?.group_id)throw new Error('Respons pembuatan kelompok kosong.');await openGroup(row.group_id);await seedInterviews().catch(e=>showError(e,'Pertanyaan wawancara belum dibuat: '));showModal('Kelompok berhasil dibuat',`<div class="result"><b>Kode kelompok untuk anggota:</b><div class="secret">${h(row.group_code)}</div><b>Kode ketua (simpan sekali ini):</b><div class="secret">${h(row.leader_code)}</div></div><div class="banner warn" style="margin-top:12px">Simpan kode ketua di tempat aman. Jangan bagikan kepada anggota biasa.</div><div class="modal-actions"><button class="btn" data-act="close-modal">Selesai</button></div>`)}catch(e){showError(e,'Gagal membuat kelompok: ')}finally{button.disabled=false}}
async function joinGroup(form){const f=new FormData(form);const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const {data,error}=await db.rpc('join_observation_group',{p_group_code:String(f.get('groupCode')).trim().toUpperCase(),p_display_name:String(f.get('displayName')).trim(),p_leader_code:String(f.get('leaderCode')||'').trim()||null});if(error)throw error;const id=data?.[0]?.group_id;if(!id)throw new Error('Respons bergabung kosong.');await openGroup(id)}catch(e){showError(e,'Gagal bergabung: ')}finally{button.disabled=false}}
async function openGroup(id){if(!me)throw new Error('Sesi Supabase belum tersedia.');closeModal();group=null;app.innerHTML='<div class="entry"><div class="paper"><h2>Membuka data kelompok...</h2><p class="muted">Membaca data dari Supabase.</p></div></div>';try{await fetchAll(id);restoreQueue();renderWorkspace();startRealtime();}catch(e){await listGroups().catch(()=>{});renderEntry('Gagal membuka kelompok: '+userFriendly(e));throw e}}
async function fetchAll(id){const req=[db.from('observation_groups').select('*').eq('id',id).single(),db.from('group_members').select('group_id,user_id,display_name,member_role,joined_at').eq('group_id',id).order('joined_at'),db.from('school_profiles').select('*').eq('group_id',id).maybeSingle(),db.from('laboratories').select('*').eq('group_id',id).order('display_order').order('created_at'),db.from('lab_details').select('*').eq('group_id',id),db.from('questions').select('*').eq('group_id',id).order('display_order'),db.from('question_answers').select('*').eq('group_id',id)];const out=await Promise.all(req);out.forEach((r,i)=>{if(r.error)throw new Error(['Kelompok','Anggota','Profil sekolah','Laboratorium','Detail ruangan','Pertanyaan','Jawaban'][i]+': '+errText(r.error))});group=out[0].data;members=out[1].data||[];myRole=members.find(m=>m.user_id===me.id)?.member_role||'member';profile=out[2].data||{group_id:id,details:{},version:0};labs=out[3].data||[];labDetails=Object.fromEntries((out[4].data||[]).map(x=>[x.lab_id,x]));questions=out[5].data||[];answers=Object.fromEntries((out[6].data||[]).map(a=>[a.question_id,a]));}
function queueStorageKey(){return `labobserve-pending-v1:${me?.id||'none'}:${group?.id||'none'}`}
function saveQueue(){try{localStorage.setItem(queueStorageKey(),JSON.stringify([...pending.entries()]))}catch(e){notify('Tidak dapat menyimpan antrean lokal. Cadangkan jawaban secara manual.','error')}}
function restoreQueue(){try{pending=new Map(JSON.parse(localStorage.getItem(queueStorageKey())||'[]'));for(const op of pending.values())applyLocalPending(op)}catch(e){pending=new Map();console.warn('Tidak dapat membaca antrean lokal',e)}scheduleFlush()}
function applyLocalPending(op){if(op.kind==='answer'){answers[op.id]={...(answers[op.id]||{}),...op.data,question_id:op.id,version:op.base,group_id:group.id}}else if(op.kind==='lab'){labDetails[op.id]={...(labDetails[op.id]||{}),details:op.data,version:op.base,lab_id:op.id}}else if(op.kind==='school'){profile={...profile,details:op.data,version:op.base}}}
function enqueue(kind,id,data){const key=kind+':'+id,prev=pending.get(key);const current=kind==='answer'?answers[id]:kind==='lab'?labDetails[id]:profile;const op={kind,id,data,base:prev?.base??(current?.version||0),rowId:prev?.rowId??(current?.id||null),rev:(prev?.rev||0)+1,conflict:false};pending.set(key,op);applyLocalPending(op);saveQueue();setStatus();scheduleFlush()}
function scheduleFlush(){clearTimeout(flushTimeout);flushTimeout=setTimeout(flushPending,850)}
function setStatus(){const status=$('#syncStatus');if(!status)return;const conflicts=[...pending.values()].filter(o=>o.conflict).length;const count=pending.size;status.textContent=conflicts?`${conflicts} konflik jawaban — perlu ditinjau`:count?`${count} perubahan belum tersinkron${navigator.onLine?'':' (offline)'}`:'✓ Semua perubahan tersimpan di Supabase';status.className='status '+(conflicts?'error':count?'':'good');$('#topInfo').textContent=group?`${group.group_name} · ${navigator.onLine?'Online':'Offline'}`:'LabObserve'}
async function persistOperation(op){if(op.kind==='answer'){
  if(!op.rowId){const r=await db.from('question_answers').insert({group_id:group.id,question_id:op.id,answer:op.data.answer||'',note:op.data.note||'',updated_by:me.id}).select('id,version,updated_at').single();if(r.error)throw r.error;return r.data}
  const r=await db.from('question_answers').update({answer:op.data.answer||'',note:op.data.note||''}).eq('id',op.rowId).eq('version',op.base).select('id,version,updated_at');if(r.error)throw r.error;if(!r.data?.length)throw Object.assign(new Error('Perubahan baru dari anggota lain terdeteksi.'),{code:'CONFLICT'});return r.data[0]
} else if(op.kind==='lab'){
  const r=await db.from('lab_details').update({details:op.data}).eq('lab_id',op.id).eq('version',op.base).select('lab_id,version,updated_at');if(r.error)throw r.error;if(!r.data?.length)throw Object.assign(new Error('Data ruangan berubah di perangkat lain.'),{code:'CONFLICT'});return r.data[0]
} else {
  const r=await db.from('school_profiles').update({details:op.data}).eq('group_id',group.id).eq('version',op.base).select('group_id,version,updated_at');if(r.error)throw r.error;if(!r.data?.length)throw Object.assign(new Error('Profil sekolah berubah di perangkat lain.'),{code:'CONFLICT'});return r.data[0]
}}
async function flushPending(){if(writing||!group||!navigator.onLine||!pending.size)return;writing=true;try{for(const [key,original] of [...pending]){const op=pending.get(key);if(!op||op.conflict)continue;const rev=op.rev;try{const saved=await persistOperation(op);const newest=pending.get(key);if(!newest)continue;if(newest.rev===rev){pending.delete(key);if(op.kind==='answer')answers[op.id]={...(answers[op.id]||{}),id:saved.id,version:saved.version};else if(op.kind==='lab')labDetails[op.id]={...(labDetails[op.id]||{}),version:saved.version};else profile={...profile,version:saved.version}}else{newest.base=saved.version;newest.rowId=saved.id||newest.rowId}saveQueue()}catch(e){if(e.code==='CONFLICT'||e.code==='23505'){const newest=pending.get(key);if(newest)newest.conflict=true;saveQueue();notify('Ada perubahan bersamaan. Klik "Tinjau konflik" untuk memilih versi jawaban.','error');continue}console.warn('Gagal sinkronisasi',e);notify('Perubahan belum dikirim. '+userFriendly(e),'error');break}}}finally{writing=false;setStatus();if([...pending.values()].some(o=>!o.conflict)&&navigator.onLine&&pending.size){clearTimeout(flushTimeout);flushTimeout=setTimeout(flushPending,3500)}}}
function answered(q){const a=answers[q.id];return !!a?.answer&&a.answer!=='Belum diperiksa'&&a.answer.trim()!==''}
function stats(){const obs=questions.filter(q=>q.kind==='observation'),inter=questions.filter(q=>q.kind==='interview');return {done:obs.filter(answered).length,all:obs.length,interDone:inter.filter(answered).length,interAll:inter.length}}
function field(label,key,val='',opts=''){return `<div class="field"><label>${h(label)}</label><input class="input" data-${opts.includes('lab')?'labfield':'schoolfield'}="${h(key)}" ${opts.includes('lab')?'data-lab="'+h(opts.split('|')[1])+'"':''} ${opts.includes('number')?'type="number" min="0" step="any"':'type="text"'} value="${h(val)}" placeholder="Isi sesuai hasil observasi"></div>`}
function textareaField(label,key,val='',scope='school',labId=''){return `<div class="field"><label>${h(label)}</label><textarea class="input" ${scope==='school'?`data-schoolfield="${h(key)}"`:`data-labfield="${h(key)}" data-lab="${h(labId)}"`} placeholder="Tuliskan informasi yang diperoleh...">${h(val)}</textarea></div>`}
function renderQuestion(q,index){const a=answers[q.id]||{answer:'',note:''};const p=pending.get('answer:'+q.id);const options=CHOICES[q.answer_type];const isText=q.kind==='interview'||q.answer_type==='text'||q.answer_type==='interview';const selection=options?`<select class="input" data-qanswer="${h(q.id)}"><option value="">— Belum dijawab —</option>${options.map(o=>`<option value="${h(o)}" ${a.answer===o?'selected':''}>${h(o)}</option>`).join('')}</select>`:`<textarea class="input" data-qanswer="${h(q.id)}" placeholder="Tulis jawaban yang disampaikan narasumber...">${h(a.answer)}</textarea>`;return `<div class="q" id="question-${h(q.id)}"><div class="row between"><span class="qid">${q.kind==='interview'?'W':index+1}. ${h(q.topic||TYPE_LABELS[q.answer_type]||'Indikator')}</span>${myRole==='leader'?`<span class="row hidden-print"><button class="btn ghost tiny" data-act="edit-q" data-id="${h(q.id)}">Ubah</button><button class="btn danger tiny" data-act="delete-q" data-id="${h(q.id)}">Hapus</button></span>`:''}</div><strong>${h(q.question_text)}</strong><div class="q-fields ${isText?'is-text':''}"><div class="field"><label>${isText?'Jawaban wawancara':'Hasil pengamatan'}</label>${selection}</div><div class="field"><label>${isText?'Catatan tambahan (opsional)':'Catatan pengamatan'}</label><textarea class="input smallarea" data-qnote="${h(q.id)}" placeholder="Catat kondisi, keterangan, atau hal penting...">${h(a.note)}</textarea></div></div>${p?`<div class="q-tools"><span class="tag ${p.conflict?'warning':''}">${p.conflict?'Ada konflik perubahan':'Menunggu sinkronisasi'}</span>${p.conflict?` <button class="btn outline tiny" data-act="resolve" data-key="answer:${h(q.id)}">Tinjau konflik</button>`:''}</div>`:''}</div>`}
function renderLab(lab,idx){const d=labDetails[lab.id]?.details||{};const area=Number(d.length)>0&&Number(d.width)>0?fmt(Number(d.length)*Number(d.width))+' m²':'Belum diisi';const seats=Number(d.tables)>0&&Number(d.perTable)>0?fmt(Number(d.tables)*Number(d.perTable))+' siswa':'Belum diisi';const lq=questions.filter(q=>q.kind==='observation'&&q.lab_id===lab.id);const completed=lq.filter(answered).length;return `<details class="lab" id="lab-${h(lab.id)}" ${idx===0?'open':''}><summary>${h(lab.lab_name)} <span class="tag" style="margin-left:8px">${completed}/${lq.length} terisi</span></summary><div class="lab-body"><div class="row between"><span class="muted small">Jenis: ${h(lab.lab_type)} ${lab.room_code?' · Kode: '+h(lab.room_code):''}</span>${myRole==='leader'?`<span class="row hidden-print"><button class="btn outline tiny" data-act="edit-lab" data-id="${h(lab.id)}">Ubah nama</button><button class="btn danger tiny" data-act="delete-lab" data-id="${h(lab.id)}">Hapus lab</button></span>`:''}</div><div class="section-head" style="margin-top:20px"><h3>Profil Ruangan dan Kapasitas</h3></div><div class="grid">${field('Panjang ruangan (m)','length',d.length||'','lab|'+lab.id+'|number')}${field('Lebar ruangan (m)','width',d.width||'','lab|'+lab.id+'|number')}${field('Jumlah meja praktikum','tables',d.tables||'','lab|'+lab.id+'|number')}${field('Siswa per meja','perTable',d.perTable||'','lab|'+lab.id+'|number')}${field('Kapasitas maksimal siswa','capacity',d.capacity||'','lab|'+lab.id+'|number')}${field('Letak / gedung / lantai','location',d.location||'','lab|'+lab.id)}</div><div class="grid" style="margin-top:12px"><div class="metric"><span class="small">Luas ruangan dihitung</span><b id="area-${h(lab.id)}">${h(area)}</b></div><div class="metric"><span class="small">Perkiraan tempat berdasarkan meja</span><b id="seats-${h(lab.id)}">${h(seats)}</b></div></div>${SECTIONS.map((section,sIndex)=>{const qs=lq.filter(q=>q.section_key===section.id);return `<details class="subsection" id="section-${h(lab.id)}-${h(section.id)}" ${sIndex===0||sIndex===1?'open':''}><summary>${sIndex+1}. ${h(section.title)} <span style="color:#6983a6;font-weight:500">(${qs.filter(answered).length}/${qs.length})</span></summary><div class="subsection-inner">${qs.length?qs.map((q,j)=>renderQuestion(q,j)).join(''):'<p class="muted small">Belum ada pertanyaan untuk aspek ini.</p>'}${renderDocChecklist(lab.id,section.id)}${myRole==='leader'?`<button class="btn outline tiny hidden-print" style="margin-top:12px" data-act="add-q" data-lab="${h(lab.id)}" data-section="${h(section.id)}">+ Tambah pertanyaan pada aspek ini</button>`:''}</div></details>`}).join('')}${myRole==='leader'&&lq.length===0?`<button class="btn hidden-print" data-act="seed-lab" data-id="${h(lab.id)}" style="margin-top:14px">Isi 22 pertanyaan bawaan</button>`:''}</div></details>`}
function renderWorkspace(){if(!group)return;const s=stats(),percent=s.all?Math.round(s.done/s.all*100):0;const common=profile.details||{};const docCount=labs.reduce((acc,lab)=>acc+Object.keys(DOCS).reduce((n,k)=>n+DOCS[k].filter((_,i)=>(labDetails[lab.id]?.details||{})[docKey(k,i)]==='Sudah ada').length,0),0);setTopInfo(`${group.group_name} · ${navigator.onLine?'Online':'Offline'}`);const links=[['sekolah','Profil Sekolah'],...labs.map(x=>['lab-'+x.id,x.lab_name]),['wawancara','Wawancara'],['ringkasan','Ringkasan']];const nav=links.map(([anchor,label])=>`<a href="#${h(anchor)}">${h(label)}</a>`).join('');app.innerHTML=`<div class="layout"><aside class="sidebar"><h3>Daftar Isi</h3>${nav}<div class="divider"></div><h3>Anggota</h3>${members.map(m=>`<div class="small" style="margin:6px 0">• ${h(m.display_name)} ${m.member_role==='leader'?'(ketua)':''}</div>`).join('')}<div class="divider"></div><button class="btn outline wide" data-act="back-home">Ganti kelompok</button></aside><main class="workspace"><div class="toc-mobile">${nav}</div><section class="paper" id="sekolah"><div class="row between"><div><span class="eyebrow">LABOBSERVE · INSTRUMEN DIGITAL</span><h1>Observasi Pengelolaan Laboratorium</h1><p class="muted small">${h(group.school_name)} · ${h(group.group_name)} · ${h(group.group_code)}</p></div><span class="tag ${myRole==='leader'?'green':''}">${myRole==='leader'?'Mode Ketua':'Mode Anggota'}</span></div><div class="grid" style="margin:17px 0"><div class="metric"><b>${percent}%</b><span class="small">Checklist pengamatan terisi</span><div class="progress" style="margin-top:7px"><div style="width:${percent}%"></div></div></div><div class="metric"><b>${s.interDone} / ${s.interAll}</b><span class="small">Wawancara terjawab</span></div></div><div class="muted small" style="margin:8px 0 12px">Dokumentasi berstatus sudah ada: ${docCount} item (tanpa unggahan berkas).</div><div id="syncStatus" class="status">Memeriksa status sinkronisasi...</div><div class="row hidden-print" style="margin:11px 0"><button class="btn outline tiny" data-act="reload">↻ Segarkan data</button><button class="btn outline tiny" data-act="backup">⬇ Cadangan JSON</button><button class="btn outline tiny" data-act="report">Pratinjau Laporan PDF</button></div><div class="banner warn">Ini <b>uji cloud</b>, bukan versi final. Data jawaban tersimpan di Supabase setelah status sinkron selesai. PWA offline penuh, Word, dan PowerPoint belum tersedia pada versi ini.</div><div class="section"><div class="section-head"><h3>A. Identitas dan Kebijakan Sekolah (diisi sekali)</h3></div><div class="grid">${field('Tanggal observasi','date',common.date||'')}${field('Jumlah laboratorium di sekolah','schoolLabCount',common.schoolLabCount||'')}${field('Nama narasumber','interviewee',common.interviewee||'')}${field('Jabatan narasumber','interviewRole',common.interviewRole||'')}</div><div style="margin-top:12px">${textareaField('Kebijakan umum pengelolaan laboratorium','policies',common.policies||'')}</div></div></section><section class="paper" id="lab-list"><div class="row between"><div><h2>B. Pengamatan Langsung + Dokumentasi</h2><p class="muted small">Satu instrumen lengkap untuk tiap ruangan, termasuk beberapa lab dengan jenis yang sama.</p></div>${myRole==='leader'?`<button class="btn hidden-print" data-act="add-lab">+ Tambah Lab</button>`:''}</div><p class="muted small">${labs.length} laboratorium tercatat. Pertanyaan bawaan: 22 indikator per laboratorium.</p>${labs.length?'':myRole==='leader'?'<div class="banner">Belum ada laboratorium. Klik Tambah Lab untuk memulai.</div>':'<div class="banner">Ketua belum menambahkan laboratorium.</div>'}</section>${labs.map(renderLab).join('')}<section class="paper" id="wawancara"><div class="row between"><div><h2>C. Pedoman Wawancara</h2><p class="muted small">Wawancara menyatu dalam satu bagian, berlaku bagi pengelolaan sekolah. Bisa mencatat keterangan khusus ruangan pada jawaban.</p></div>${myRole==='leader'?`<button class="btn outline tiny hidden-print" data-act="add-q" data-lab="" data-section="wawancara">+ Pertanyaan</button>`:''}</div>${questions.filter(q=>q.kind==='interview').map(renderQuestion).join('')}${myRole==='leader'&&!questions.some(q=>q.kind==='interview')?'<button class="btn hidden-print" data-act="seed-interviews">Isi 9 pertanyaan bawaan</button>':''}</section><section class="paper" id="ringkasan"><h2>D. Temuan, Kesimpulan, dan Rekomendasi</h2><div class="stack">${textareaField('Temuan utama','findings',common.findings||'')}${textareaField('Kesimpulan','conclusion',common.conclusion||'')}${textareaField('Rekomendasi','recommendations',common.recommendations||'')}</div><div class="banner" style="margin-top:15px">Gunakan tombol Pratinjau Laporan untuk membuat PDF berisi paragraf laporan, bukan cetakan formulir. Berkas foto tidak dilampirkan karena hanya status dokumentasinya yang dicatat.</div></section><div class="footer-action"><span id="footerStatus">${pending.size?'Perubahan menunggu sinkronisasi':'LabObserve terhubung ke cloud'}</span><button class="btn" data-act="reload">Segarkan</button></div></main></div>`;setStatus()}
function openLabModal(id){if(myRole!=='leader')return;const lab=labs.find(x=>x.id===id);showModal(lab?'Ubah Laboratorium':'Tambah Laboratorium',`<form id="labForm" data-id="${h(id||'')}" class="stack"><div class="field"><label>Jenis laboratorium</label><select class="input" name="type">${['Kimia','Biologi','Fisika','IPA Terpadu','Lainnya'].map(x=>`<option ${lab?.lab_type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Nama ruangan</label><input class="input" name="name" value="${h(lab?.lab_name||'')}" placeholder="Laboratorium Kimia 2" minlength="2" maxlength="150" required></div><div class="field"><label>Kode ruangan (opsional)</label><input class="input" name="roomCode" value="${h(lab?.room_code||'')}" placeholder="Contoh KIM-02"></div><div class="modal-actions"><button type="button" class="btn outline" data-act="close-modal">Batal</button><button type="submit" class="btn">Simpan Laboratorium</button></div></form>`)}
async function saveLab(form){const f=new FormData(form),id=form.dataset.id,btn=form.querySelector('[type="submit"]');btn.disabled=true;try{const data={lab_type:String(f.get('type')),lab_name:String(f.get('name')).trim(),room_code:String(f.get('roomCode')||'')};let lab;if(id){const r=await db.from('laboratories').update(data).eq('id',id).eq('group_id',group.id).select('*').single();if(r.error)throw r.error;lab=r.data}else{const r=await db.from('laboratories').insert({...data,group_id:group.id,display_order:labs.length+1}).select('*').single();if(r.error)throw r.error;lab=r.data}closeModal();await fetchAll(group.id);restoreQueue();renderWorkspace();if(!id){await seedLabQuestions(lab.id)}else notify('Perubahan nama laboratorium tersimpan.','good')}catch(e){showError(e,'Gagal menyimpan laboratorium: ')}finally{btn.disabled=false}}
async function seedLabQuestions(labId){if(myRole!=='leader')return;const existing=questions.filter(x=>x.lab_id===labId);if(existing.length){notify('Laboratorium sudah memiliki pertanyaan. Tidak ditambahkan ulang.');return}const rows=SECTIONS.flatMap((section,sIndex)=>section.questions.map(([text,type],i)=>({group_id:group.id,lab_id:labId,kind:'observation',section_key:section.id,topic:section.title,question_text:text,answer_type:type,display_order:sIndex*100+i,is_default:true})));const r=await db.from('questions').insert(rows);if(r.error){showError(r.error,'Lab dibuat, tetapi pertanyaan bawaan gagal ditambahkan: ');return}await reloadData(true);notify('22 indikator bawaan ditambahkan.','good')}
async function seedInterviews(){if(myRole!=='leader')return;if(questions.some(q=>q.kind==='interview')){notify('Pertanyaan wawancara sudah ada.');return}const rows=INTERVIEW_BANK.map(([topic,text],i)=>({group_id:group.id,lab_id:null,kind:'interview',section_key:'wawancara',topic,question_text:text,answer_type:'interview',display_order:i,is_default:true}));const r=await db.from('questions').insert(rows);if(r.error)throw r.error;await reloadData(true);notify('9 pertanyaan wawancara bawaan ditambahkan.','good')}
function openQuestionModal(id='',labId='',section=''){if(myRole!=='leader')return;const q=questions.find(x=>x.id===id);const school=!labId&&!q?.lab_id;const kind=q?.kind||(school?'interview':'observation');showModal(q?'Ubah Pertanyaan':'Tambah Pertanyaan',`<form id="questionForm" data-id="${h(id)}" data-lab="${h(labId||q?.lab_id||'')}" data-section="${h(section||q?.section_key||'')}" class="stack"><div class="field"><label>Kalimat pertanyaan</label><textarea class="input" name="text" minlength="3" maxlength="1500" required>${h(q?.question_text||'')}</textarea></div>${kind==='interview'?'<div class="banner">Bagian wawancara menggunakan jawaban teks terbuka.</div>':`<div class="field"><label>Jenis jawaban</label><select class="input" name="type">${Object.entries(TYPE_LABELS).filter(([k])=>k!=='interview').map(([key,label])=>`<option value="${key}" ${q?.answer_type===key?'selected':''}>${label}</option>`).join('')}</select></div>`}<div class="modal-actions"><button type="button" class="btn outline" data-act="close-modal">Batal</button><button type="submit" class="btn">Simpan Pertanyaan</button></div></form>`)}
async function saveQuestion(form){const id=form.dataset.id,labId=form.dataset.lab||null,section=form.dataset.section||'wawancara',f=new FormData(form),btn=form.querySelector('[type="submit"]');btn.disabled=true;try{const existing=questions.find(x=>x.id===id);const kind=existing?.kind||(labId?'observation':'interview');const text=String(f.get('text')||'').trim();if(text.length<3)throw new Error('Pertanyaan minimal 3 karakter.');const payload={question_text:text,answer_type:kind==='interview'?'interview':String(f.get('type')||'text')};let r;if(id)r=await db.from('questions').update(payload).eq('id',id).eq('group_id',group.id);else r=await db.from('questions').insert({...payload,group_id:group.id,lab_id:labId,section_key:section,topic:kind==='interview'?'Pertanyaan tambahan':(SECTIONS.find(x=>x.id===section)?.title||section),kind,display_order:kind==='interview'?100+questions.filter(q=>q.kind==='interview').length:999,is_default:false});if(r.error)throw r.error;closeModal();await reloadData(true);notify('Pertanyaan berhasil disimpan.','good')}catch(e){showError(e,'Gagal menyimpan pertanyaan: ')}finally{btn.disabled=false}}
async function deleteQuestion(id){if(myRole!=='leader')return;const q=questions.find(x=>x.id===id);if(!q||!confirm(`Hapus pertanyaan: “${q.question_text}”? Jawaban pada pertanyaan ini juga akan terhapus.`))return;const r=await db.from('questions').delete().eq('id',id).eq('group_id',group.id);if(r.error){showError(r.error,'Tidak dapat menghapus pertanyaan: ');return}await reloadData(true)}
async function deleteLab(id){if(myRole!=='leader')return;const lab=labs.find(x=>x.id===id);if(!lab||!confirm(`Hapus ${lab.lab_name} beserta seluruh checklist dan jawaban? Tindakan ini tidak dapat dibatalkan.`))return;const r=await db.from('laboratories').delete().eq('id',id).eq('group_id',group.id);if(r.error){showError(r.error,'Gagal menghapus laboratorium: ');return}await reloadData(true)}
async function reloadData(force=false){if(!group)return;const focused=document.activeElement?.matches('input,textarea,select');if(focused&&!force){notify('Ada perubahan baru. Selesaikan pengisian atau klik Segarkan.');return}const oldGroupId=group.id;const prevQueue=new Map(pending);const openIds=[...document.querySelectorAll('details[open]')].map(el=>el.id);const y=window.scrollY;try{await fetchAll(oldGroupId);pending=prevQueue;for(const op of pending.values())applyLocalPending(op);renderWorkspace();for(const item of document.querySelectorAll('details')){if(openIds.includes(item.id))item.open=true;else if(openIds.length)item.open=false}window.scrollTo({top:y,behavior:'instant'});setStatus()}catch(e){showError(e,'Gagal memuat ulang: ')}}
function startRealtime(){if(currentChannel){db.removeChannel(currentChannel);currentChannel=null}if(!group)return;const id=group.id;currentChannel=db.channel(`labobserve-${id}`).on('postgres_changes',{event:'*',schema:'public',table:'question_answers',filter:`group_id=eq.${id}`},()=>scheduleReload()).on('postgres_changes',{event:'*',schema:'public',table:'questions',filter:`group_id=eq.${id}`},()=>scheduleReload()).on('postgres_changes',{event:'*',schema:'public',table:'laboratories',filter:`group_id=eq.${id}`},()=>scheduleReload()).subscribe(status=>{if(status==='CHANNEL_ERROR')notify('Realtime terputus; gunakan Segarkan untuk melihat pembaruan anggota.','error')});if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>{if(group&&document.visibilityState==='visible'&&!pending.size&&!writing)reloadData(false)},45000)}
function scheduleReload(){clearTimeout(reloadTimeout);reloadTimeout=setTimeout(()=>{if(!pending.size&&!writing)reloadData(false);else notify('Ada pembaruan dari anggota lain; klik Segarkan setelah perubahanmu tersimpan.')},1000)}
async function loadRemoteFor(op){let q;if(op.kind==='answer')q=db.from('question_answers').select('*').eq('question_id',op.id).maybeSingle();else if(op.kind==='lab')q=db.from('lab_details').select('*').eq('lab_id',op.id).maybeSingle();else q=db.from('school_profiles').select('*').eq('group_id',group.id).maybeSingle();const r=await q;if(r.error)throw r.error;return r.data}
async function resolve(opKey){const op=pending.get(opKey);if(!op)return;try{const remote=await loadRemoteFor(op);const localLabel=JSON.stringify(op.data,null,2);const remoteData=op.kind==='answer'?{answer:remote?.answer||'',note:remote?.note||''}:remote?.details||{};showModal('Perubahan bersamaan terdeteksi',`<p class="muted small">Versi lokal dan versi terbaru dari anggota lain berbeda. Pilih tindakan secara sadar.</p><div class="grid"><div><b class="small">Versi perangkatmu</b><pre style="white-space:pre-wrap;word-break:break-word;background:#eef4ff;border-radius:8px;padding:11px;font-size:11px;max-height:230px;overflow:auto">${h(localLabel)}</pre></div><div><b class="small">Versi dari cloud</b><pre style="white-space:pre-wrap;word-break:break-word;background:#eef4ff;border-radius:8px;padding:11px;font-size:11px;max-height:230px;overflow:auto">${h(JSON.stringify(remoteData,null,2))}</pre></div></div><div class="modal-actions"><button class="btn outline" data-act="use-cloud" data-key="${h(opKey)}">Gunakan versi cloud</button><button class="btn" data-act="keep-local" data-key="${h(opKey)}">Simpan versiku</button></div>`)}catch(e){showError(e,'Tidak bisa membaca versi terbaru: ')}}
async function settleConflict(key,choice){const op=pending.get(key);if(!op)return;try{const remote=await loadRemoteFor(op);if(choice==='cloud'){pending.delete(key);saveQueue();if(op.kind==='answer'){if(remote)answers[op.id]=remote;else delete answers[op.id]}else if(op.kind==='lab'){if(remote)labDetails[op.id]=remote}else if(remote)profile=remote}else{op.base=remote?.version||0;op.rowId=remote?.id||null;op.conflict=false;pending.set(key,op);saveQueue();scheduleFlush()}closeModal();renderWorkspace();setStatus()}catch(e){showError(e,'Konflik belum terselesaikan: ')}}
function updateMetrics(labId){const d=labDetails[labId]?.details||{};const area=$('#area-'+CSS.escape(labId)),seats=$('#seats-'+CSS.escape(labId));if(area)area.textContent=Number(d.length)>0&&Number(d.width)>0?fmt(Number(d.length)*Number(d.width))+' m²':'Belum diisi';if(seats)seats.textContent=Number(d.tables)>0&&Number(d.perTable)>0?fmt(Number(d.tables)*Number(d.perTable))+' siswa':'Belum diisi'}
function handleFormField(el){if(!group)return;if(el.dataset.qanswer||el.dataset.qnote){const id=el.dataset.qanswer||el.dataset.qnote;const previous=answers[id]||{answer:'',note:'',version:0};const answer=el.dataset.qanswer!==undefined?el.value:previous.answer;const note=el.dataset.qnote!==undefined?el.value:previous.note;if((previous.answer||'')===answer&&(previous.note||'')===note)return;enqueue('answer',id,{answer,note});return}if(el.dataset.schoolfield){if((profile.details||{})[el.dataset.schoolfield]===el.value)return;enqueue('school',group.id,{...(profile.details||{}),[el.dataset.schoolfield]:el.value});return}if(el.dataset.labfield){const id=el.dataset.lab;if(!id)return;if((labDetails[id]?.details||{})[el.dataset.labfield]===el.value)return;enqueue('lab',id,{...(labDetails[id]?.details||{}),[el.dataset.labfield]:el.value});updateMetrics(id)}}

function proseValue(value){return String(value??'').trim().replace(/\s+/g,' ')}
function safeSentence(value){const x=proseValue(value);return x?x+(/[.!?]$/.test(x)?'':'.'):''}
const REPORT_SUBJECTS={
 'umum':['pemanfaatan laboratorium sesuai fungsi praktikum','fasilitas dasar laboratorium'],
 'ruang':['penataan area praktikum, persiapan, dan penyimpanan','ventilasi serta pencahayaan ruang','sumber air, wastafel, dan instalasi listrik'],
 'alat':['penataan dan penyimpanan alat','kondisi dan kelayakan alat praktikum'],
 'bahan':['label, identitas, serta informasi bahaya bahan','penyimpanan bahan berdasarkan karakteristik dan kompatibilitas'],
 'rawat':['pembersihan dan pemeliharaan alat serta area kerja','catatan perawatan, pemeriksaan, dan kalibrasi'],
 'jadwal':['jadwal penggunaan laboratorium','pelaksanaan penggunaan laboratorium sesuai jadwal'],
 'inventaris':['daftar atau sistem inventaris alat dan bahan','pencatatan stok, peminjaman, serta kondisi alat dan bahan'],
 'mutu':['SOP dan tata tertib laboratorium','penerapan SOP serta tata tertib'],
 'limbah':['wadah penampungan limbah berlabel','pemilahan limbah berdasarkan jenis dan karakteristik'],
 'k3':['APAR serta kotak P3K','APD, tanda keselamatan, serta petunjuk evakuasi','instruksi keselamatan dan prosedur tanggap darurat']
};
function reportLine(question,answer){
 const a=proseValue(answer), type=question.answer_type;
 if(!a||a==='Belum diperiksa')return '';
 const defaults=SECTIONS.find(s=>s.id===question.section_key)?.questions||[];
 const index=defaults.findIndex(q=>q[0]===question.question_text);
 const subject=index>=0?REPORT_SUBJECTS[question.section_key]?.[index]:null;
 if(!subject)return `Untuk indikator “${proseValue(question.question_text)}”, kelompok mencatat hasil ${a.toLowerCase()}.`;
 if(type==='condition')return `Berdasarkan pengamatan, ${subject} dinilai ${a.toLowerCase()}.`;
 if(type==='availability'||type==='document')return `Berdasarkan pengamatan, ${subject} ${a==='Ada'||a==='Tersedia'?'tersedia':a==='Tidak ada'||a==='Tidak tersedia'?'tidak tersedia':`berstatus ${a.toLowerCase()}`}.`;
 if(type==='procedure')return `Berdasarkan pengamatan, ${subject} ${a==='Diterapkan'?'telah diterapkan':a==='Sebagian'?'baru diterapkan sebagian':a==='Tidak diterapkan'?'belum diterapkan':`tercatat ${a.toLowerCase()}`}.`;
 return `Pada aspek ${subject}, hasil pengamatan dicatat: ${safeSentence(a)}`;
}
function reportIdentity(label,value){return `<div><strong>${h(label)}</strong><span>: ${h(value||'Belum dicatat')}</span></div>`}
function reportPara(text,cls=''){return `<p${cls?' class="'+cls+'"':''}>${h(text)}</p>`}
function makeNarrativeReport(){
 if(!group)return '';
 const common=profile.details||{};
 const date=common.date||'Belum dicatat';
 const count=stats();
 const docCount=labs.reduce((sum,lab)=>sum+Object.entries(DOCS).reduce((n,[key,items])=>n+items.filter((_,i)=>(labDetails[lab.id]?.details||{})[docKey(key,i)]==='Sudah ada').length,0),0);
 let html=`<header><h1>LAPORAN HASIL OBSERVASI<br>PENGELOLAAN LABORATORIUM SEKOLAH</h1><p class="report-subtitle">${h(group.school_name)}</p></header>`;
 html+=`<div class="report-meta">${reportIdentity('Nama sekolah',group.school_name)}${reportIdentity('Kelompok',group.group_name)}${reportIdentity('Tanggal observasi',date)}${reportIdentity('Narasumber',common.interviewee)}${reportIdentity('Jabatan narasumber',common.interviewRole)}${reportIdentity('Laboratorium dicatat',`${labs.length} ruangan`)}</div>`;
 html+=`<section class="report-intro"><h2>I. PENDAHULUAN</h2>${reportPara('Observasi ini ditujukan untuk mendokumentasikan kondisi ruang, fasilitas, pengelolaan alat dan bahan, inventarisasi, pemeliharaan, penjadwalan, mutu, keselamatan kerja, serta penanganan limbah laboratorium sekolah. Laporan ini disusun dari jawaban pengamatan dan catatan wawancara yang telah diisi oleh kelompok di LabObserve.')}`;
 if(proseValue(common.policies))html+=reportPara(`Kebijakan pengelolaan yang dicatat kelompok: ${safeSentence(common.policies)}`);
 html+=`</section><section><h2>II. HASIL PENGAMATAN LANGSUNG</h2>`;
 if(!labs.length)html+=reportPara('Belum terdapat laboratorium yang dicatat.','report-empty');
 for(let li=0;li<labs.length;li++){
   const lab=labs[li],d=labDetails[lab.id]?.details||{};
   const parts=[];
   if(d.location||lab.building||lab.floor)parts.push(`berlokasi di ${proseValue(d.location||lab.building||lab.floor)}`);
   const length=Number(d.length),width=Number(d.width);
   if(length>0&&width>0)parts.push(`berukuran ${fmt(length)} × ${fmt(width)} meter dengan luas terhitung ${fmt(length*width)} m²`);
   else if(d.length||d.width)parts.push('data ukuran ruangnya belum lengkap');
   if(d.tables)parts.push(`memiliki ${proseValue(d.tables)} meja praktikum`);
   if(d.perTable)parts.push(`dengan jumlah ${proseValue(d.perTable)} siswa per meja`);
   if(d.capacity)parts.push(`berkapasitas ${proseValue(d.capacity)} siswa menurut data yang diisi`);
   html+=`<h3>${li+1}. ${h(lab.lab_name)}${lab.room_code?' ('+h(lab.room_code)+')':''}</h3>`;
   if(parts.length)html+=reportPara(`${lab.lab_name} ${parts.join(', ')}.`);
   else html+=reportPara('Data ukuran, jumlah meja, dan kapasitas laboratorium ini belum dicatat.','report-empty');
   for(const section of SECTIONS){
     const qs=questions.filter(q=>q.kind==='observation'&&q.lab_id===lab.id&&q.section_key===section.id);
     const statements=[];let unreviewed=0;
     for(const q of qs){const a=answers[q.id]||{};const phrase=reportLine(q,a.answer);if(phrase)statements.push(phrase+(proseValue(a.note)?` Catatan: ${safeSentence(a.note)}`:''));else{unreviewed++;if(proseValue(a.note))statements.push(`Catatan yang telah dicatat untuk ${q.question_text}: ${safeSentence(a.note)}`)}}
     const selected=(DOCS[section.id]||[]).map((name,i)=>({name,value:d[docKey(section.id,i)]||'Belum diperiksa'}));
     const available=selected.filter(x=>x.value==='Sudah ada').map(x=>x.name.toLowerCase());
     const missing=selected.filter(x=>x.value==='Belum ada').map(x=>x.name.toLowerCase());
     if(!statements.length&&!available.length&&!missing.length)continue;
     html+=`<h3>${h(section.title)}</h3>`;
     if(statements.length)html+=reportPara(statements.join(' '));
     else html+=reportPara('Belum ada hasil pengamatan yang diisi untuk aspek ini.','report-empty');
     if(unreviewed&&qs.length)html+=reportPara(`${unreviewed} indikator pada aspek ini belum memiliki hasil pemeriksaan lengkap.`,'report-empty');
     if(available.length)html+=reportPara(`Dokumentasi yang ditandai sudah tersedia meliputi ${available.join(', ')}.`);
     if(missing.length)html+=reportPara(`Dokumentasi yang ditandai belum tersedia meliputi ${missing.join(', ')}.`);
     if(!available.length&&!missing.length)html+=reportPara('Status dokumentasi aspek ini belum diperiksa.','report-empty');
   }
 }
 html+=`</section><section><h2>III. HASIL WAWANCARA</h2>`;
 const ia=questions.filter(q=>q.kind==='interview'&&proseValue(answers[q.id]?.answer));
 if(ia.length){
   for(const q of ia){const a=answers[q.id];if(!a?.answer)continue;html+=reportPara(`Pada topik ${proseValue(q.topic||q.question_text).toLowerCase()}, keterangan narasumber yang dicatat adalah sebagai berikut: ${safeSentence(a.answer)}${proseValue(a.note)?' Catatan tambahan: '+safeSentence(a.note):''}`)}
 }else html+=reportPara('Jawaban wawancara belum dicatat.','report-empty');
 html+=`</section><section><h2>IV. TEMUAN DAN PEMBAHASAN</h2>`;
 if(proseValue(common.findings))html+=reportPara(safeSentence(common.findings));
 else html+=reportPara(`Dari ${count.all} indikator pengamatan, ${count.done} telah diisi dan ${count.all-count.done} belum dinyatakan selesai diperiksa. Sebanyak ${docCount} item dokumentasi telah ditandai tersedia. Bagian temuan utama belum dituliskan oleh kelompok; penilaian akhir perlu disesuaikan dengan kondisi yang benar-benar diamati.`,'report-empty');
 html+=`</section><section><h2>V. KESIMPULAN DAN REKOMENDASI</h2>`;
 html+=`<h3>Kesimpulan</h3>${reportPara(proseValue(common.conclusion)?safeSentence(common.conclusion):'Kesimpulan belum diisi oleh kelompok.',''+(!proseValue(common.conclusion)?'report-empty':''))}`;
 html+=`<h3>Rekomendasi</h3>${reportPara(proseValue(common.recommendations)?safeSentence(common.recommendations):'Rekomendasi belum diisi oleh kelompok.',''+(!proseValue(common.recommendations)?'report-empty':''))}`;
 html+=`<p class="report-empty" style="font-size:11px;border-top:1px solid #cad4df;padding-top:10px;margin-top:25px">Catatan: Status dokumentasi foto merupakan laporan ketersediaan menurut isian kelompok. Berkas foto dan video tidak dilampirkan dan tidak diunggah melalui LabObserve. Data yang belum diperiksa tidak diperlakukan sebagai temuan faktual. Dibuat dari isian LabObserve pada ${h(new Date().toLocaleString('id-ID'))}.</p></section>`;
 return html;
}
function openReport(){
 if(!group)return;
 if(pending.size)notify('Masih ada perubahan yang belum tersinkron. Pratinjau menggunakan isian saat ini, tetapi cloud mungkin berbeda.','error');
 $('#reportContent').innerHTML=makeNarrativeReport();
 $('#reportView').classList.add('show');
 document.body.style.overflow='hidden';
 $('#reportView').scrollTop=0;
}
function closeReport(){
 $('#reportView').classList.remove('show');
 document.body.style.overflow='';
}
$('#reportCloseBtn').addEventListener('click',closeReport);
$('#reportSaveBtn').addEventListener('click',()=>{
 document.body.classList.add('report-print');
 window.print();
});
window.addEventListener('afterprint',()=>document.body.classList.remove('report-print'));

function backupJSON(){if(!group)return;const data={format:'LabObserve Cloud Test Backup',savedAt:new Date().toISOString(),group,labs,labDetails,questions,answers,profile,changesNotSynced:[...pending.values()]};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`LabObserve_${group.group_code}_cadangan.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Cadangan JSON dibuat (tanpa media).','good')}
app.addEventListener('submit',async e=>{if(!['createGroupForm','joinGroupForm','labForm','questionForm'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='createGroupForm')await createGroup(e.target);else if(e.target.id==='joinGroupForm')await joinGroup(e.target)});
$('#modal').addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='labForm')await saveLab(e.target);else if(e.target.id==='questionForm')await saveQuestion(e.target)});
app.addEventListener('input',e=>{if(e.target.matches('[data-qanswer],[data-qnote],[data-schoolfield],[data-labfield]'))handleFormField(e.target)});
app.addEventListener('change',e=>{if(e.target.matches('[data-qanswer],[data-qnote],[data-schoolfield],[data-labfield]')){handleFormField(e.target);scheduleFlush()}});
app.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const action=b.dataset.act,id=b.dataset.id;if(action==='open-group')await openGroup(id);else if(action==='back-home'){if(pending.size&&!confirm('Ada perubahan yang belum tersinkron. Tetap pindah kelompok?'))return;if(currentChannel)db.removeChannel(currentChannel);currentChannel=null;await listGroups();renderEntry()}else if(action==='add-lab')openLabModal();else if(action==='edit-lab')openLabModal(id);else if(action==='delete-lab')await deleteLab(id);else if(action==='seed-lab')await seedLabQuestions(id);else if(action==='seed-interviews')try{await seedInterviews()}catch(e){showError(e,'Gagal menyiapkan wawancara: ')}else if(action==='add-q')openQuestionModal('',b.dataset.lab,b.dataset.section);else if(action==='edit-q')openQuestionModal(id);else if(action==='delete-q')await deleteQuestion(id);else if(action==='resolve')await resolve(b.dataset.key);else if(action==='reload')await reloadData(true);else if(action==='backup')backupJSON();else if(action==='report')openReport()});
$('#modal').addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const action=b.dataset.act;if(action==='close-modal')closeModal();else if(action==='keep-local'||action==='use-cloud')await settleConflict(b.dataset.key,action==='keep-local'?'local':'cloud')});
window.addEventListener('online',()=>{setStatus();scheduleFlush()});window.addEventListener('offline',()=>{setStatus();notify('Offline: jawaban yang diketik disimpan sementara di browser. Jangan hapus data browser.','error')});
window.addEventListener('beforeunload',()=>{saveQueue()});
(async function boot(){try{await authenticate();await listGroups();renderEntry();}catch(e){app.innerHTML=`<div class="entry"><section class="paper"><h2>Koneksi Supabase belum berhasil</h2><div class="status error">${h(userFriendly(e))}</div><p class="muted">Pastikan Anonymous Sign-ins sudah aktif dan coba buka kembali ketika internet tersedia.</p><button class="btn" onclick="location.reload()">Coba lagi</button></section></div>`}})();
</script>
</body>
</html>
