ss="counter">${state.labs.length}</strong><span>Ruangan tercatat</span></div><div class="stat"><strong id="header-done" class="counter">${total.done}</strong><span>Jawaban terisi</span></div><div class="stat"><strong id="header-percent" class="counter">${total.pct}%</strong><span>Progres pertanyaan</span></div></div></section>${l.map((lab,i)=>renderLab(lab,i)).join('')}${renderInterviews()}<section class="document doc-section" id="summary"><div class="section-heading"><div><h2>Rekapitulasi, Temuan, dan Kesimpulan</h2><p>Rangkum hasil dari semua laboratorium yang diamati</p></div><span class="tag green">Dokumen akhir</span></div><div class="stat-grid"><div class="stat"><strong>${state.labs.length}</strong><span>Laboratorium</span></div><div class="stat"><strong id="summary-answered">${total.done}</strong><span>Jawaban</span></div><div class="stat"><strong id="summary-progress">${total.pct}%</strong><span>Kelengkapan</span></div></div><div class="stack" style="margin-top:17px">${fieldArea('Temuan penting dari seluruh laboratorium','findings',state.summary.findings,'Tuliskan temuan yang paling relevan...','summary')}${fieldArea('Kesimpulan','conclusion',state.summary.conclusion,'Ringkasan hasil observasi...','summary')}${fieldArea('Rekomendasi perbaikan','recommendations',state.summary.recommendations,'Saran berdasarkan pengamatan dan wawancara...','summary')}</div><div class="section-heading" style="margin-top:28px"><div><h2>Ekspor hasil observasi</h2><p>Cetak lembar lengkap atau lihat pratinjau PowerPoint terpilih</p></div></div><div class="final-panel no-print"><button class="btn" data-action="print">${ico('print','sm')} Cetak / Simpan PDF</button><button class="btn secondary" data-action="export-modal">${ico('file','sm')} Pratinjau PPTX</button><button class="btn ghost" data-action="backup">${ico('download','sm')} Cadangan JSON</button></div><p class="muted smalltext" style="margin-top:12px">Ekspor DOCX dan PPTX sebenarnya, pemilihan video/QR publik, dan sinkronisa function renderLab(lab,index){const area=Number(lab.length)>0&&Number(lab.width)>0?fmt.format(Number(lab.length)*Number(lab.width)):'—';const seats=Number(lab.tables)>0&&Number(lab.perTable)>0?fmt.format(Number(lab.tables)*Number(lab.perTable)):'—';return `<section class="panel lab-section" id="lab-${lab.id}"><div class="lab-top"><div><div class="row" style="margin-bottom:6px"><span style="font-size:10px;color:#c7dcff;letter-spacing:1.1px;font-weight:800">LABORATORIUM ${index+1}</span><span style="background:#ffffff25;padding:2px 8px;border-radius:15px;font-size:10px">${esc(lab.type)}</span></div><h2>${esc(lab.name)}</h2><p>${esc(lab.building||'Gedung belum diisi')} ${lab.roomCode?'• '+esc(lab.roomCode):''}</p></div><button class="btn small" style="background:#ffffff20;color:#fff;border:1px solid #ffffff57" data-action="lab-collapse" data-id="${lab.id}">${ico('down','sm')} <span id="lab-toggle-label-${lab.id}">Tutup</span></button></div><div class="lab-body" id="lab-body-${lab.id}"><div class="lab-toolbar no-print">${session.role==='leader'?`<button class="btn ghost small" data-action="rename-lab" data-id="${lab.id}">${ico('edit','sm')} Ubah lab</button><button class="btn danger small" data-action="delete-lab" data-id="${lab.id}">${ico('trash','sm')} Hapus lab</button>`:''}</div><div class="inner-section" id="${lab.id}-identitas"><div class="inner-top"><h3>Profil Ruangan dan Kapasitas</h3><span class="tag">Data per ruang</span></div><div class="grid3" style="margin-top:15px">${labField(lab,'Nama laboratorium','name')}${labField(lab,'Jenis laboratorium','type')}${labField(lab,'Kode/nomor ruang','roomCode','Contoh: LAB-KIM-2')}${labField(lab,'Gedung/lokasi','building','Contoh: Gedung A')}${labField(lab,'Lantai','floor','Contoh: 2')}${labField(lab,'Kapasitas resmi (siswa)','capacity','Contoh: 36','number')}${labField(lab,'Panjang (meter)','length','Contoh: 12','number')}${labField(lab,'Lebar (meter)','width','Contoh: 8','number')}${labField(lab,'Jumlah meja praktikum', function renderSection(lab,s,i){const questions=lab.sections[s.id]||[];const checks=questions.filter(x=>x.type!=='interview');return `<div class="inner-section" id="${lab.id}-${s.id}"><div class="inner-top"><div><h3>${i+1}. ${esc(s.title)}</h3><p>${checks.length} indikator inti · checklist, catatan, foto, dan video dalam satu tempat</p></div>${session.role==='leader'?`<button class="btn secondary small no-print" data-action="new-question" data-lab="${lab.id}" data-section="${s.id}">${ico('plus','sm')} Pertanyaan</button>`:''}</div><div class="subheading">${ico('check','sm')} Pengamatan langsung & dokumentasi</div>${checks.map((q,j)=>renderQuestion(lab,s,q,j+1)).join('')||'<p class="muted smalltext">Belum ada indikator observasi.</p>'}<div class="photo-area"><div class="upload-row"><div><div class="row"><span style="color:#2a5aa0">${ico('photo')}</span><b>Foto & video bukti pengamatan</b></div><p class="muted tiny">Lampirkan beberapa media yang mendukung jawaban pada aspek ${esc(s.title)}.</p></div><label class="btn secondary small no-print" style="cursor:pointer">${ico('upload','sm')} Unggah media<input type="file" class="hidden" data-media-upload="1" data-lab="${lab.id}" data-section="${s.id}" accept="image/*,video/*" multiple/></label></div><div class="media-grid" id="media-${lab.id}-${s.id}">${renderMedia(lab.id,s.id)}</div><p class="muted tiny no-print" style="margin-top:8px">Media tersimpan lokal di browser ini, maksimal 40 MB per berkas dalam demo.</p></div></div>`}
function renderInterviews(){const interviews=state.interviews||[];const extra=state.labs.flatMap(lab=>SECTIONS.flatMap(sec=>(lab.sections[sec.id]||[]).filter(q=>q.type==='interview').map(q=>({lab,sec,q}))));return `<section class="document doc-section" id="interview"><div class="section-heading"><div><h2>C. Wawancara Lengkap</h2><p>9 pertanyaan inti; ditanyakan satu kali kepada narasumber yang mengetahui pengelolaan sekolah</p></div><span class="tag">${interviews.length} pertanyaan</span></div><div class="cover-note" style="margin:0 0 16px">Tuliskan jawaban narasumber secara utuh. Bila kondisi antar laboratorium berbeda, sebutkan nama ruang pada jawaban. Tidak perlu mengulang pertanyaan untuk setiap lab. Jawaban boleh ringkas asalkan tetap menggambarkan prosedur dan bukti.</div><div class="grid2">${field('Nama narasumber','interviewee',state.common.interviewee||'','Nama guru/laboran')}${field('Jabatan narasumber','interviewRole',state.common.interviewRole||'','Contoh: Kepala laboratorium')}</div><div class="stack" style="margin-top:16px">${interviews.map((q,i)=>`<div class="question"><div class="question-header"><div><span class="tag" style="margin-bottom:7px">${esc(q.topic||'Wawancara')}</span><div class="question-title">${i+1}. ${esc(q.text)}</div></div>${session.role==='leader'?`<div class="qactions no-print"><button title="Edit pertanyaan" data-action="edit-question" data-lab="school" data-section="wawancara" data-q="${q.id}">${ico('edit','sm')}</button><button title="Hapus pertanyaan" data-action="delete-question" data-lab="school" data-section="wawancara" data-q="${q.id}">${ico('trash','sm')}</button></div>`:''}</div><textarea class="input answer-text" data-scope="question" data-lab="school" data-section="wawancara" data-q="${q.id}" data-field="answer" placeholder="Jawaban narasumber...">${esc(q.answer||'')}</textarea><div class="qnote"><label class="label">Catatan / tindak lanjut (opsional)</label><textarea class="input" data-scope="question" data-lab="school" data-section="wawancara" data-q="${q.id}" data-field="note" placeholder="Contoh bukti, perbedaan antar lab, atau pertanyaan lanjutan...">${esc(q.note||'')}</textarea></div></div>`).join('')}</div>${extra.length?`<div class="subheading" style="margin-top:18px">${ico('mic','sm')} Pertanyaan tambahan khusus laboratorium</div>${extra.map(({lab,sec,q},i)=>`<div class="smalltext muted" style="margin-top:10px">${esc(lab.name)} · ${esc(sec.title)}</div>${renderQuestion(lab,sec,q,i+1)}`).join('')}`:''}${session.role==='leader'?`<button class="btn secondary small no-print" style="margin-top:16px" data-action="new-question" data-lab="school" data-section="wawancara">${ico('plus','sm')} Tambah pertanyaan wawancara</button>`:''}</section>`}
function renderQuestion(lab,s,q,index){const inter=q.type==='interview',val=String(q.answer||'');return `<div class="question"><div class="question-header"><div class="question-title">${index}. ${esc(q.text)}</div>${session.role==='leader'?`<div class="qactions no-print"><button title="Edit pertanyaan" data-action="edit-question" data-lab="${lab.id}" data-section="${s.id}" data-q="${q.id}">${ico('edit','sm')}</button><button title="Hapus pertanyaan" data-action="delete-question" data-lab="${lab.id}" data-section="${s.id}" data-q="${q.id}">${ico('trash','sm')}</button></div>`:''}</div>${inter?`<textarea class="input answer-text" data-scope="question" data-lab="${lab.id}" data-section="${s.id}" data-q="${q.id}" data-field="answer" placeholder="Tuliskan jawaban narasumber...">${esc(val)}</textarea>`:`<div class="answer-options" role="group" aria-label="${esc(q.text)}">${[...TYPE_OPTIONS[q.type],'Tidak relevan','Belum diperiksa'].map((o,i)=>`<label class="option"><input type="radio" name="answer-${q.id}" data-scope="question" data-lab="${lab.id}" data-section="${s.id}" data-q="${q.id}" data-field="answer" value="${esc(o)}" ${(val===o||(!val&&o==='Belum diperiksa'))?'checked':''}/>${esc(o)}</label>`).join('')}</div>`}<div class="qnote"><label class="label">${inter?'Catatan tambahan (opsional)':'Catatan hasil pengamatan'}</label><textarea class="input" data-scope="question" data-lab="${lab.id}" data-section="${s.id}" data-q="${q.id}" data-field="note" placeholder="${inter?'Informasi tambahan, tindak lanjut, atau bukti...':'Tuliskan kondisi, bukti, atau alasan penilaian...'}">${esc(q.note||'')}</textarea></div></div>`}
function labById(lid){return state.labs.find(x=>x.id===lid)}
function findQ(lid,sid,qid){return lid==='school'&&sid==='wawancara'?state.interviews?.find(x=>x.id===qid):labById(lid)?.sections[sid]?.find(x=>x.id===qid)}
function getProgress(){let done=0,total=0;for(const lab of state?.labs||[])for(const sec of SECTIONS)for(const q of lab.sections[sec.id]||[]){total++;if(String(q.answer||'').trim()&&q.answer!=='Belum diperiksa')done++}for(const q of state?.interviews||[]){total++;if(String(q.answer||'').trim())done++}return {total,done,pct:total?Math.round(100*done/total):0}}
function updateProgress(){const p=getProgress();const ids={'#header-done':p.done,'#header-percent':`${p.pct}%`,'#side-percent':`${p.pct}%`,'#progress-detail':`${p.done} dari ${p.total} jawaban`,'#summary-answered':p.done,'#summary-progress':`${p.pct}%`};for(const [sel,txt] of Object.entries(ids)){const el=$(sel);if(el)el.textContent=txt}const bar=$('#side-progress-fill');if(bar)bar.style.width=p.pct+'%'}
function renderMedia(lid,sid){const found=mediaItems.filter(m=>m.labId===lid&&m.sectionId===sid);return found.map(m=>{const url=urlFor(m);return `<div class="media-card">${m.type.startsWith('image/')?`<img class="media-visual" src="${url}" alt="${esc(m.caption||m.name)}" loading="lazy"/>`:`<video class="media-visual" src="${url}" controls preload="metadata"></video>`}<div class="media-meta"><div class="media-name" title="${esc(m.name)}">${m.type.startsWith('image/')?ico('photo','sm'):ico('video','sm')} ${esc(m.name)}</div><input class="input" aria-label="Keterangan media" data-media-caption="${m.id}" value="${esc(m.caption||'')}" placeholder="Keterangan media..."/><button class="btn danger small no-print full" data-action="delete-media" data-id="${m.id}">${ico('trash','sm')} Hapus</button></div></div>`}).join('')||'<div class="muted smalltext" style="padding:10px 0">Belum ada dokumentasi untuk aspek ini.</div>'}
function refreshOneMedia(lid,sid){const el=$(`#media-${lid}-${sid}`);if(el)el.innerHTML=renderMedia(lid,sid)}
function urlFor(m){if(!mediaUrls.has(m.id))mediaUrls.set(m.id,URL.createObjectURL(m.blob));return mediaUrls.get(m.id)}
function openMediaDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB tidak tersedia'));const req=indexedDB.open('LabObserveDemoMediaV2',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('media'))req.result.createObjectStore('media',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function initMedia(){try{mediaDB=await openMediaDB();await refreshMedia()}catch(e){console.warn(e);notify('Penyimpanan media lokal tidak tersedia pada browser ini.','error')}}
function txMedia(mode,op){return new Promise((resolve,reject)=>{if(!mediaDB)return reject(new Error('Penyimpanan media belum siap'));const tx=mediaDB.transaction('media',mode);let result;try{result=op(tx.objectStore('media'))}catch(e){reject(e);return}tx.oncomplete=()=>resolve(result?.result);tx.onerror=()=>reject(tx.error)})}
async function refreshMedia(){if(!mediaDB)return;try{const results=await txMedia('readonly',s=>s.getAll());mediaItems=(results||[]).filter(m=>m.groupId===state?.code);if(session)for(const lab of state.labs)for(const sec of SECTIONS)refreshOneMedia(lab.id,sec.id)}catch(e){console.error(e)}}
async function mediaUpload(inp){const files=[...(inp.files||[])];const lid=inp.dataset.lab,sid=inp.dataset.section;if(!mediaDB){notify('Penyimpanan media lokal belum siap.','error');return}let success=0;for(const file of files){if(!(file.type.startsWith('video/')||file.type.startsWith('image/'))){notify('Hanya foto/video yang didukung.','error');continue}if(file.size>40*1024*1024){notify(`${file.name}: melebihi 40 MB untuk demo.`,'error');continue}const item={id:id(),groupId:state.code,labId:lid,sectionId:sid,name:file.name,type:file.type,caption:'',blob:file,created:Date.now()};try{await txMedia('readwrite',s=>s.put(item));mediaItems.push(item);success++}catch(e){notify('Gagal menyimpan media. Periksa kapasitas perangkat.','error')}}refreshOneMedia(lid,sid);inp.value='';if(success)notify(`${success} media tersimpan secara lokal.`)}
function modalLab(existing){const lab=existing?labById(existing):null;openModal(`${head(lab?'Ubah laboratorium':'Tambah laboratorium','Jenis laboratorium boleh sama, misalnya Kimia 1 dan Kimia 2.')}<form id="labForm" data-lab="${lab?.id||''}"><div class="modal-body stack"><div class="field"><label>Jenis laboratorium</label><select class="input" name="type"><option ${lab?.type==='Kimia'?'selected':''}>Kimia</option><option ${lab?.type==='Biologi'?'selected':''}>Biologi</option><option ${lab?.type==='Fisika'?'selected':''}>Fisika</option><option ${lab?.type==='IPA Terpadu'?'selected':''}>IPA Terpadu</option><option ${lab?.type==='Lainnya'?'selected':''}>Lainnya</option></select></div><div class="field"><label>Nama/identitas ruangan</label><input class="input" name="name" value="${esc(lab?.name||'')}" placeholder="Contoh: Laboratorium Kimia 3" required/></div><div class="grid2"><div class="field"><label>Gedung/lokasi (opsional)</label><input class="input" name="building" value="${esc(lab?.building||'')}" placeholder="Gedung A"/></div><div class="field"><label>Kode ruangan (opsional)</label><input class="input" name="roomCode" value="${esc(lab?.roomCode||'')}" placeholder="LAB-KIM-03"/></div></div><div class="modal-note">Lab baru mendapat salinan independen semua pertanyaan bawaan. Ketua dapat mengubah pertanyaan khusus tanpa memengaruhi lab lainnya.</div></div><div class="modal-footer"><button type="button" class="btn ghost" data-action="close">Batal</button><button type="submit" class="btn">${lab?'Simpan perubahan':'Tambahkan laboratorium'}</button></div></form>`)}
function modalQuestion(lid,sid,qid){const school=lid==='school'&&sid==='wawancara',lab=school?{id:'school',name:'Wawancara seluruh sekolah'}:labById(lid),sec=school?{id:'wawancara',title:'Pertanyaan Wawancara'}:SECTIONS.find(x=>x.id===sid),q=qid?findQ(lid,sid,qid):null;if(!lab||!sec)return;const types=school?['interview']:Object.keys(TYPE_OPTIONS);openModal(`${head(q?'Edit pertanyaan':'Tambah pertanyaan',`${lab.name} · ${sec.title}`)}<form id="questionForm" data-lab="${lid}" data-section="${sid}" data-q="${qid||''}"><div class="modal-body stack"><div class="field"><label>Pertanyaan</label><textarea class="input" name="text" required placeholder="Tuliskan pertanyaan...">${esc(q?.text||'')}</textarea></div><div class="field"><label>Jenis jawaban</label><select class="input" name="type">${types.map(t=>`<option value="${t}" ${q?.type===t?'selected':''}>${TYPE_LABEL[t]}</option>`).join('')}</select></div><div class="modal-note">Mengubah jenis jawaban dapat mengosongkan jawaban lama jika jenisnya berubah. Catatan tetap dipertahankan. Wawancara sekolah terpisah dari checklist per aspek.</div></div><div class="modal-footer"><button class="btn ghost" type="button" data-action="close">Batal</button><button class="btn" type="submit">Simpan pertanyaan</button></div></form>`)}
function modalMobileMenu(){openModal(`${head('Daftar Isi','Pilih bagian yang ingin dibuka dalam dokumen panjang.')}<div class="modal-body stack"><button class="navlink" data-scroll="school">Identitas sekolah</button><button class="navlink" data-scroll="policy">Kebijakan bersama</button>${state.labs.map(l=>`<button class="navlink" data-scroll="lab-${l.id}">${esc(l.name)}</button>`).join('')}<button class="navlink" data-scroll="summary">Temuan & kesimpulan</button><button class="btn secondary full" data-action="add-lab">${ico('plus')} Tambah laboratorium</button></div>`)}
function exportModal(){const selectable=mediaItems.filter(m=>state.labs.some(l=>l.id===m.labId));const answered=state.labs.flatMap(l=>SECTIONS.flatMap(s=>(l.sections[s.id]||[]).filter(q=>q.type!=='interview'&&q.answer&&q.answer!=='Belum diperiksa').map(q=>({lab:l,section:s,q}))));openModal(`${head('Ekspor dan pratinjau hasil','PDF bisa dicetak sekarang; PPTX & DOCX akan diimplementasikan berikutnya.')}<div class="modal-body stack"><div class="grid2"><button class="btn full" data-action="print">${ico('print','sm')} Cetak / Simpan PDF</button><button class="btn secondary full" data-action="backup">${ico('download','sm')} Cadangkan jawaban JSON</button></div><div class="modal-note">Cetak PDF menggunakan fitur Print di browser, lalu pilih “Save as PDF”. Ekspor DOCX dan PPTX asli belum tersedia pada prototipe.</div><hr class="divider"/><h3 style="color:#1b497f">Atur pratinjau PowerPoint</h3><div class="grid2"><div><b class="smalltext">Pilih laboratorium</b>${state.labs.map(l=>`<label class="pick-row"><input type="checkbox" class="ppt-lab" value="${l.id}" checked/>${esc(l.name)}</label>`).join('')}</div><div><b class="smalltext">Pilih aspek</b>${SECTIONS.map(s=>`<label class="pick-row"><input type="checkbox" class="ppt-sec" value="${s.id}" ${['umum','ruang','alat','bahan','inventaris','limbah','k3'].includes(s.id)?'checked':''}/>${esc(s.title)}</label>`).join('')}</div></div><hr class="divider"/><h3 style="color:#1b497f;font-size:14px">Pilih temuan yang ingin ditampilkan</h3><div style="max-height:190px;overflow:auto;border:1px solid #e2eaf5;border-radius:10px;padding:8px 12px">${answered.length?answered.map(({lab,section,q})=>`<label class="pick-row"><input type="checkbox" class="ppt-q" value="${q.id}" checked/><span><b>${esc(lab.name)}:</b> ${esc(q.text)} <span class="tag">${esc(q.answer)}</span></span></label>`).join(''):'<p class="muted smalltext">Belum ada checklist yang terisi. Temuan akan tersedia setelah kamu mulai mengisi instrumen.</p>'}</div><h3 style="color:#1b497f;font-size:14px">Pilih foto dan mode video per berkas</h3><div style="max-height:200px;overflow:auto;border:1px solid #e2eaf5;border-radius:10px;padding:8px 12px">${selectable.length?selectable.map(m=>m.type.startsWith('image/')?`<label class="pick-row"><input type="checkbox" class="ppt-photo" value="${m.id}" checked/> ${ico('photo','sm')} ${esc(m.caption||m.name)}</label>`:`<div class="pick-row" style="flex-wrap:wrap">${ico('video','sm')} <span style="flex:1;min-width:110px">${esc(m.caption||m.name)}</span><select class="select-small ppt-video" data-id="${m.id}"><option value="embed">Sematkan offline</option><option value="qr">Tautan / QR</option><option value="omit">Tidak disertakan</option></select></div>`).join(''):'<p class="muted smalltext">Belum ada foto atau video yang diunggah. Unggah media pada akhir aspek untuk memilihnya di sini.</p>'}</div><div class="grid2"><label class="pick-row"><input type="checkbox" id="ppt-interviews" checked/> Sertakan slide wawancara terpisah</label><label class="pick-row"><input type="checkbox" id="ppt-summary" checked/> Sertakan kesimpulan</label></div><button class="btn full" data-action="ppt-preview">${ico('play','sm')} Lihat pratinjau slide</button></div>`)}
function makeSlides(){const labs=[...document.querySelectorAll('.ppt-lab:checked')].map(e=>e.value),secs=[...document.querySelectorAll('.ppt-sec:checked')].map(e=>e.value);if(!labs.length||!secs.length){notify('Pilih minimal satu lab dan satu aspek.','error');return}const picks={questions:new Set([...document.querySelectorAll('.ppt-q:checked')].map(e=>e.value)),photos:new Set([...document.querySelectorAll('.ppt-photo:checked')].map(e=>e.value)),videos:new Map([...document.querySelectorAll('.ppt-video')].map(e=>[e.dataset.id,e.value])),interviews:$('#ppt-interviews').checked,summary:$('#ppt-summary').checked};slidesData=[{type:'cover',title:'Observasi Pengelolaan Laboratorium Sekolah',detail:`${state.school} · ${state.groupName}`}];for(const lid of labs){const lab=labById(lid);for(const sid of secs){const sec=SECTIONS.find(x=>x.id===sid);const qs=lab.sections[sid]||[],observations=qs.filter(x=>x.type!=='interview'&&picks.questions.has(x.id)).slice(0,4).map(x=>`${x.text} — ${x.answer}`);const media=mediaItems.filter(x=>x.labId===lid&&x.sectionId===sid);const pics=media.filter(x=>x.type.startsWith('image/')&&picks.photos.has(x.id));const vids=media.filter(x=>x.type.startsWith('video/')&&(picks.videos.get(x.id)||'omit')!=='omit').map(x=>({id:x.id,name:x.caption||x.name,mode:picks.videos.get(x.id)}));slidesData.push({type:'aspect',title:`${lab.name} · ${sec.title}`,detail:observations,interviews:[],photos:pics,videoChoices:vids})}}if(picks.interviews){const core=(state.interviews||[]).filter(q=>q.answer?.trim()).map(q=>`${q.topic||'Wawancara'}: ${q.answer}`);const extra=state.labs.filter(l=>labs.includes(l.id)).flatMap(l=>SECTIONS.flatMap(s=>(l.sections[s.id]||[]).filter(q=>q.type==='interview'&&q.answer?.trim()).map(q=>`${l.name}: ${q.text} — ${q.answer}`)));const answers=[...core,...extra];if(answers.length){for(let i=0;i<answers.length;i+=3)slidesData.push({type:'interview',title:`Hasil Wawancara ${Math.floor(i/3)+1}`,detail:answers.slice(i,i+3)});}else slidesData.push({type:'interview',title:'Hasil Wawancara',detail:['Jawaban wawancara belum diisi.']})}if(picks.summary)slidesData.push({type:'summary',title:'Kesimpulan dan Rekomendasi',detail:[state.summary.conclusion||'Kesimpulan belum diisi.',state.summary.recommendations||'Rekomendasi belum diisi.']});slideIndex=0;showSlide()}
function showSlide(){const s=slidesData[slideIndex];const items=s.type==='cover'?[s.detail]:s.type==='summary'?s.detail:[...(s.detail||[]),...(s.interviews||[])];const content=items.length?items.map(x=>`<div style="margin-bottom:6px;overflow-wrap:anywhere">• ${esc(x).slice(0,200)}</div>`).join(''):'Belum ada jawaban yang dipilih untuk aspek ini.';const firstPhoto=s.photos?.[0];const pic=firstPhoto?`<img src="${urlFor(firstPhoto)}" alt="Foto terpilih" style="width:100%;height:100%;min-height:70px;object-fit:cover;border-radius:7px"/>`:ico('photo','lg');const videoStr=(s.videoChoices||[]).map(v=>v.mode==='qr'?'QR':'Offline').join(', ');openModal(`${head('Pratinjau PowerPoint','Slide ini merupakan visualisasi web, belum file .pptx.')}<div class="modal-body"><div class="slide-preview"><div class="slide-top"><span>LABOBSERVE / HASIL OBSERVASI</span><span>${String(slideIndex+1).padStart(2,'0')} / ${slidesData.length}</span></div><h3>${esc(s.title)}</h3><div class="slide-content"><div class="slide-text">${content}</div><div class="slide-media" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px">${s.type==='aspect'?`${pic}<div>${(s.photos||[]).length} foto · ${(s.videoChoices||[]).length} video ${esc(videoStr)}</div>`:'Identitas / Ringkasan'}</div></div><div style="color:#6183ab;font-size:9px">Pendidikan Kimia • LabObserve • Pratinjau</div></div><div class="modal-actions"><button class="btn ghost small" data-action="slide-prev" ${slideIndex===0?'disabled':''}>Sebelumnya</button><span class="smalltext muted">Slide ${slideIndex+1} dari ${slidesData.length}</span><button class="btn secondary small" data-action="slide-next" ${slideIndex===slidesData.length-1?'disabled':''}>Berikutnya</button></div><div class="modal-note" style="margin-top:15px">Ini pratinjau konten, bukan pengunduhan PPTX. Penempelan video offline dan QR Code publik membutuhkan implementasi ekspor serta penyimpanan online.</div></div><div class="modal-footer"><button class="btn ghost" data-action="export-modal">Kembali ke pengaturan</button><button class="btn" data-action="close">Selesai</button></div>`)}
function backup(){save();const clean=JSON.stringify({exportedAt:new Date().toISOString(),note:'Cadangan jawaban LabObserve demo. Media foto dan video tersimpan terpisah di browser.',data:state},null,2);const blob=new Blob([clean],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LabObserve_${state.code}_cadangan.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Cadangan JSON jawaban berhasil dibuat (tanpa foto/video).')}
function appEvents(){const app=$('#app');app.addEventListener('submit',e=>{if(e.target.id==='createForm'){e.preventDefault();const f=new FormData(e.target);groupCreate(false,{groupName:String(f.get('groupName')).trim(),school:String(f.get('school')).trim(),name:String(f.get('name')).trim()})}else if(e.target.id==='joinForm'){e.preventDefault();const f=new FormData(e.target);const code=String(f.get('code')).trim().toUpperCase(),name=String(f.get('name')).trim();if(!state||state.code!==code){notify('Kode tidak ditemukan di browser ini. Kolaborasi online belum tersedia.','error');return}session={name,role:'member'};if(!state.members.includes(name))state.members.push(name);save();render();refreshMedia();notify('Berhasil bergabung dalam demo lokal.')} });app.addEventListener('input',dataChange);app.addEventListener('change',e=>{if(e.target.dataset.scope)dataChange(e);if(e.target.dataset.mediaUpload)mediaUpload(e.target);if(e.target.dataset.mediaCaption){const m=mediaItems.find(x=>x.id===e.target.dataset.mediaCaption);if(m){m.caption=e.target.value;txMedia('readwrite',s=>s.put(m)).catch(()=>notify('Keterangan media gagal disimpan','error'))}}});app.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-scroll]');if(!b)return;if(b.dataset.scroll){closeModal();document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}const a=b.dataset.action;switch(a){case 'entry-tab':entryTab=b.dataset.tab;render();break;case 'demo':groupCreate(true);break;case 'reset-demo':if(confirm('Ganti data kelompok pada browser ini? Cadangkan JSON dahulu jika diperlukan.')){state=null;localStorage.removeItem(STORAGE);entryTab='create';render()}break;case 'resume':session={name:state.leaderName,role:'leader'};render();refreshMedia();break;case 'show-codes':showCodes();break;case 'copy-code':navigator.clipboard?.writeText(b.dataset.value).then(()=>notify('Kode tersalin.')).catch(()=>notify('Tidak dapat menyalin otomatis. Salin dari kotak teks.'));break;case 'add-lab':if(session.role==='leader')modalLab();else notify('Hanya ketua yang dapat menambah ruangan.','error');break;case 'rename-lab':modalLab(b.dataset.id);break;case 'delete-lab':if(state.labs.length<=1){notify('Minimal satu laboratorium harus ada.','error');break}if(confirm('Hapus laboratorium beserta seluruh jawaban? Dokumentasi lokal akan tetap tersimpan sampai dibersihkan.')){state.labs=state.labs.filter(x=>x.id!==b.dataset.id);save();render();refreshMedia()}break;case 'new-question':modalQuestion(b.dataset.lab,b.dataset.section);break;case 'edit-question':modalQuestion(b.dataset.lab,b.dataset.section,b.dataset.q);break;case 'delete-question':if(session.role!=='leader')break;{const q=findQ(b.dataset.lab,b.dataset.section,b.dataset.q);if(confirm(`Hapus pertanyaan “${q?.text||''}”?\nJawaban pada pertanyaan ini juga akan dihapus dari tampilan.`)){const lab=labById(b.dataset.lab);if(b.dataset.lab==='school')state.interviews=state.interviews.filter(x=>x.id!==b.dataset.q);else lab.sections[b.dataset.section]=lab.sections[b.dataset.section].filter(x=>x.id!==b.dataset.q);save();render();refreshMedia()}}break;case 'lab-collapse':{const body=$(`#lab-body-${b.dataset.id}`);const isHidden=body.classList.toggle('hidden');$(`#lab-toggle-label-${b.dataset.id}`).textContent=isHidden?'Buka':'Tutup'}break;case 'delete-media':{const m=mediaItems.find(x=>x.id===b.dataset.id);if(m&&confirm(`Hapus dokumentasi ${m.name}?`)){txMedia('readwrite',s=>s.delete(m.id)).then(()=>{mediaItems=mediaItems.filter(x=>x.id!==m.id);if(mediaUrls.has(m.id)){URL.revokeObjectURL(mediaUrls.get(m.id));mediaUrls.delete(m.id)}refreshOneMedia(m.labId,m.sectionId);notify('Media dihapus.')}).catch(()=>notify('Gagal menghapus media.','error'))}}break;case 'print':closeModal();window.print();break;case 'export-modal':exportModal();break;case 'backup':backup();break;case 'ppt-preview':makeSlides();break;case 'mobile-menu':modalMobileMenu();break;case 'switch-user':session=null;render();break;default:break}})}
function dataChange(e){const el=e.target,s=el.dataset.scope;if(!s||!state)return;const field=el.dataset.field,value=el.value;if(s==='school'){state.common[field]=value}else if(s==='root'){state[field]=value}else if(s==='summary'){state.summary[field]=value}else if(s==='lab'){const lab=labById(el.dataset.lab);if(lab){lab[field]=value;if(field==='length'||field==='width'){const v=Number(lab.length)>0&&Number(lab.width)>0?fmt.format(Number(lab.length)*Number(lab.width)):'—';$(`#area-${lab.id}`).textContent=`${v} m²`}if(field==='tables'||field==='perTable'){const v=Number(lab.tables)>0&&Number(lab.perTable)>0?fmt.format(Number(lab.tables)*Number(lab.perTable)):'—';$(`#seats-${lab.id}`).textContent=`${v} siswa`}}}else if(s==='question'){const q=findQ(el.dataset.lab,el.dataset.section,el.dataset.q);if(q){q[field]=value;updateProgress()}}scheduleSave()}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-scroll]');if(!b)return;const a=b.dataset.action;if(b.dataset.scroll){closeModal();document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}if(a==='close')closeModal();else if(a==='copy-code'){navigator.clipboard?.writeText(b.dataset.value).then(()=>notify('Kode tersalin.')).catch(()=>notify('Silakan salin kode manual.'))}else if(a==='print'){closeModal();window.print()}else if(a==='backup')backup();else if(a==='export-modal')exportModal();else if(a==='ppt-preview')makeSlides();else if(a==='slide-prev'){slideIndex--;showSlide()}else if(a==='slide-next'){slideIndex++;showSlide()}else if(a==='add-lab')modalLab()});
$('#modal').addEventListener('submit',e=>{if(e.target.id==='labForm'){e.preventDefault();const f=new FormData(e.target),existing=e.target.dataset.lab;let lab=existing?labById(existing):null;const type=String(f.get('type')),name=String(f.get('name')).trim();if(!name)return;if(!lab){lab=newLab(type,state.labs.filter(l=>l.type===type).length+1);state.labs.push(lab)}lab.type=type;lab.name=name;lab.building=String(f.get('building'));lab.roomCode=String(f.get('roomCode'));save();closeModal();render();refreshMedia();notify(existing?'Laboratorium diperbarui.':'Laboratorium ditambahkan.');document.getElementById(`lab-${lab.id}`)?.scrollIntoView({behavior:'smooth'})}else if(e.target.id==='questionForm'){e.preventDefault();const f=new FormData(e.target),lid=e.target.dataset.lab,sid=e.target.dataset.section,qid=e.target.dataset.q,lab=lid==='school'?null:labById(lid),q=qid?findQ(lid,sid,qid):null,text=String(f.get('text')).trim(),type=lid==='school'?'interview':String(f.get('type'));if(!text)return;if(q){if(q.type!==type)q.answer='';q.text=text;q.type=type}else if(lid==='school')state.interviews.push({id:id(),topic:'Pertanyaan tambahan',text,type,answer:'',note:''});else lab.sections[sid].push({id:id(),text,type,answer:'',note:''});save();closeModal();render();refreshMedia();notify('Pertanyaan disimpan.');document.getElementById(lid==='school'?'interview':`${lid}-${sid}`)?.scrollIntoView({behavior:'smooth'})}});
window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);save()});
appEvents();render();initMedia();
</script>
